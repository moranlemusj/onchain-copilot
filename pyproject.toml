[project]
name = "onchain-copilot"
version = "0.1.0"
description = "LangGraph agent for on-chain research — ask it about any Ethereum wallet or contract."
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langgraph>=0.2.50",
    "langsmith>=0.1",
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
    "web3>=7",
    "langchain-chroma>=0.1",
    "langchain-text-splitters>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
onchain = "copilot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]
